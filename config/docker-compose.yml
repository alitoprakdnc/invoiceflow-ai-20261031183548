version: "3.9"

services:
  # -------------------------------------------------
  # PostgreSQL – relational store
  # -------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: invoiceflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invoice_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
      POSTGRES_DB: ${POSTGRES_DB:-invoiceflow}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # -------------------------------------------------
  # Redis – caching, session store, queue metrics
  # -------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: invoiceflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  # -------------------------------------------------
  # Tesseract OCR service – provides tesseract CLI
  # -------------------------------------------------
  tesseract:
    image: ghcr.io/tesseract-ocr/tesseract:5.3.1-ubuntu20.04
    container_name: invoiceflow-tesseract
    restart: unless-stopped
    volumes:
      - shared-data:/app/data
    entrypoint: ["sleep", "infinity"]   # keep container alive; backend accesses CLI via shared volume
    healthcheck:
      test: ["CMD-SHELL", "tesseract --version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # -------------------------------------------------
  # LLM Service – FastAPI wrapper around Ollama (or OpenAI compatible)
  # -------------------------------------------------
  llm-service:
    build:
      context: ./backend/llm
      dockerfile: Dockerfile
    container_name: invoiceflow-llm
    restart: unless-stopped
    environment:
      # Ollama runs inside the same container; expose its HTTP API on 11434
      OLLAMA_HOST: "0.0.0.0"
      OLLAMA_PORT: "11434"
      # FastAPI settings
      LLM_API_URL: "http://localhost:11434/api/generate"
      LLM_MODEL: ${LLM_MODEL:-llama2}
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - tesseract

  # -------------------------------------------------
  # Backend API Gateway – Go / Gin
  # -------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: config/Dockerfile.backend
    container_name: invoiceflow-backend
    restart: unless-stopped
    environment:
      # Core services
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-invoice_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
      DB_NAME: ${POSTGRES_DB:-invoiceflow}
      REDIS_URL: redis://redis:6379/0
      # OCR & LLM
      OCR_VOLUME_PATH: /shared/data
      LLM_SERVICE_URL: http://llm-service:8000
      # JWT / Auth
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY not set}
      # Secret Manager – in dev we fall back to env vars
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-key.json
    volumes:
      - shared-data:/shared/data
      - ./config/secrets:/secrets:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # -------------------------------------------------
  # Frontend – React + Vite (served by Nginx)
  # -------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../config/Dockerfile.frontend
    container_name: invoiceflow-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost/api
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - backend

  # -------------------------------------------------
  # Nginx reverse‑proxy – routes /api to backend, serves SPA fallback
  # -------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: invoiceflow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_build:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && curl -f http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  redis-data:
  shared-data:
  frontend_build:
    external: false

networks:
  default:
    name: invoiceflow-network
    driver: bridge